name: vigilante-diario

# Vigilante de fuentes congeladas, en su propio flujo y sin despliegue.
#
# POR QUE SEPARADO. En AgroPatentIndex un fetcher estuvo roto diecinueve dias
# sin que nadie lo notara, porque el runner conservaba la ultima copia buena y
# la corrida terminaba en verde. Aqui fallar es el producto: este flujo se pone
# en rojo y GitHub si notifica un flujo rojo. Como no despliega nada, fallar no
# deja el tablero sin actualizar.

on:
  schedule:
    # Media hora despues de la ingesta, para medir lo que la ingesta acaba de
    # dejar en el reporte de fetch.
    - cron: "30 13 * * *"
  workflow_dispatch:

concurrency:
  group: vigilante-diario
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frescura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Control positivo del vigilante
        # Primero se prueba que el vigilante SI detecta una fuente congelada.
        # Sin esto, un verde del paso siguiente no distingue entre fuentes sanas
        # y un vigilante roto.
        run: |
          if python ingesta/check_fuentes_stale.py --reporte fixtures/pista_b/fetch_report_congelado.json; then
            echo "::error::el vigilante paso en verde el control positivo: esta roto"
            exit 1
          fi
          echo "control positivo detectado como congelado"

      - name: Frescura de las fuentes en vivo
        run: python ingesta/check_fuentes_stale.py

      - name: Control positivo del vigilante de cadencia
        # Mismo razonamiento que el control de arriba, y aqui hace mas falta:
        # el vigilante de cadencia tiene que distinguir una plaza semanal
        # callada un jueves, que esta al dia, de la misma plaza callada un
        # lunes, que falto. Un vigilante que siempre dijera "al dia" pasaria el
        # paso siguiente en verde.
        if: always()
        run: python tools/verificar_cadencia.py --control-callada

      - name: Plazas que faltaron a su propia cita
        # Por plaza y contra su cadencia DECLARADA, no por fuente. El vigilante
        # de fuentes congeladas mide el SNIIM entero, asi que una plaza puede
        # morirse sin que se note mientras Iztapalapa siga publicando: es como
        # murio la Central de Abasto de Cuautla en octubre de 2025.
        if: always()
        run: python ingesta/check_cadencia.py

      - name: Control positivo del vigilante de reaparicion
        # Se prueba contra un registro de control en el que una plaza SI volvio,
        # y se exige que el vigilante salga en rojo. Sin esto, el verde del paso
        # siguiente no distingue entre una plaza que sigue muerta y un vigilante
        # que ya no sabe mirar.
        if: always()
        run: python tools/verificar_reaparicion.py --control-reaparicion

      - name: Plazas muertas que podrian haber vuelto
        # Sale en ROJO el dia en que una plaza muerta vuelve a traer filas. Es
        # una buena noticia que interrumpe a proposito: rojo es lo unico que
        # GitHub notifica, y este flujo no despliega, asi que fallar aqui no
        # deja el tablero sin actualizar.
        if: always()
        run: python ingesta/check_reaparicion.py

      - name: Plazas que dejaron de moverse
        # Avisa del cambio de estado, no del estado: una plaza quieta conocida
        # se reporta como nota y solo la transicion pone la corrida en rojo.
        # Corre aunque el paso anterior falle, porque son dos preguntas
        # distintas: una mira la descarga y la otra mira el dato.
        if: always()
        run: python ingesta/check_plazas_quietas.py
