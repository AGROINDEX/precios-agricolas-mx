name: ingesta-diaria

# Ingesta incremental de las dos fuentes, una vez al dia. Este flujo si puede
# desplegar: su trabajo es dejar el dato y la pagina al dia.
#
# Lo que NO hace, a proposito: no corre el vigilante de fuentes congeladas. Si
# lo corriera aqui, una fuente congelada tumbaria el despliegue y el tablero se
# quedaria sin actualizar justo el dia en que hay algo que avisar. El vigilante
# vive en vigilante-diario.yml.

on:
  schedule:
    # 13:00 UTC es cerca de las 07:00 en el centro de Mexico, despues del corte
    # de la madrugada en las centrales y antes de que abra la jornada comercial.
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ingesta-diaria
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar la base de la corrida anterior
        # La base NO se versiona: con 42 plazas pesa del orden de 130 MB y
        # comitearla cada dia haria crecer el repositorio eso diario. Vive en la
        # cache del corredor, que es exactamente para lo que la cache existe.
        #
        # Si la cache se perdio, la ingesta lo nota sola: `--dias auto` mira la
        # base y pide la ventana completa en vez de los ultimos dias. Perder la
        # cache cuesta unos minutos de descarga, no un hueco en el historico.
        uses: actions/cache@v4
        with:
          path: datos/pista_b/precios.db
          key: precios-db-${{ github.run_id }}
          restore-keys: |
            precios-db-

      - name: Ingesta del SNIIM
        # Una peticion de rango por plaza, no una por dia: con 42 plazas y 90
        # dias, por dia serian 3,690 peticiones y por rango son 42.
        run: python ingesta/sniim.py --dias auto
        continue-on-error: true

      - name: Ingesta de la Central de Abasto
        run: python ingesta/ficeda.py
        continue-on-error: true

      - name: Indicadores propios
        run: python ingesta/derivados.py

      - name: Construir la pagina
        run: python web/construir.py

      - name: Guardar la memoria entre corridas
        # Se versionan tres cosas y cada una por una razon distinta:
        #
        #   _fetch_report.json  le permite al vigilante saber cuando fue el
        #                       ultimo fetch BUENO, no el ultimo intento.
        #   _sondas.json        guarda el INTENTO por plaza vigilada. Una plaza
        #                       muerta no tiene ni una fila en la base, asi que
        #                       sin este archivo no habria forma de saber que se
        #                       le pregunto ni de notar el dia en que vuelva.
        #
        # Las dos son memoria que NO se puede reconstruir desde la fuente, y las
        # dos pesan kilobytes. La base si se reconstruye, asi que no entra aqui:
        # vive en la cache del corredor.
        #
        # La pagina NO se versiona: la construye el flujo de publicacion desde
        # esta misma base, asi que no hay dos escritores del mismo archivo.
        run: |
          git config user.name "ingesta-diaria"
          git config user.email "noreply@users.noreply.github.com"
          git add datos/pista_b/_fetch_report.json datos/pista_b/_sondas.json
          git diff --staged --quiet || git commit -m "ingesta diaria $(date -u +%F)"
          git push
